<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070a11"><title>Capture · Muse CRM</title><link rel="icon" href="../assets/muse-favicon.svg"><link rel="stylesheet" href="../pages.css"><link rel="stylesheet" href="../crm.css"></head><body class="route-capture">
<canvas id="signal-field" aria-hidden="true"></canvas><div class="grain" aria-hidden="true"></div><main class="page-shell"><header class="page-top"><a class="page-brand" href="../index.html"><img src="../assets/muse-mark.svg" alt="">MUSE<span style="color:#c8ff5a">.</span></a><a class="back-link" href="../index.html">← Signal Desk</a></header><section class="page-hero"><span class="eyebrow">QUICK ACTION / CAPTURE</span><h1>Put it in the system.</h1><p>Capture a signal once. Muse keeps it available across contacts, pipeline, money, and your next actions.</p></section><div class="crm-toolbar"><div class="crm-filters"><select class="crm-select" id="captureType"><option value="contact">New contact</option><option value="deal">New deal</option><option value="transaction">Money / transaction</option><option value="task">Follow-up task</option></select></div></div><form class="crm-form crm-card" id="captureForm"><div class="crm-field" data-for="contact deal"><label>Name / company</label><input class="crm-input" name="name" required></div><div class="crm-field" data-for="contact"><label>Person</label><input class="crm-input" name="person" placeholder="Who do you work with?"></div><div class="crm-field" data-for="contact"><label>Email</label><input class="crm-input" type="email" name="email"></div><div class="crm-field" data-for="contact deal"><label>Stage</label><select class="crm-select" name="stage"><option>New</option><option>Qualified</option><option>Proposal</option><option>Won</option><option>Lost</option></select></div><div class="crm-field" data-for="deal transaction"><label>Amount</label><input class="crm-input" type="number" step="0.01" name="amount" placeholder="0"></div><div class="crm-field" data-for="deal"><label>Due date</label><input class="crm-input" type="date" name="due"></div><div class="crm-field" data-for="transaction"><label>Type</label><select class="crm-select" name="txType"><option value="income">Income</option><option value="expense">Expense</option></select></div><div class="crm-field" data-for="transaction"><label>Category</label><input class="crm-input" name="category" placeholder="Software, income, travel…"></div><div class="crm-field" data-for="task"><label>Task title</label><input class="crm-input" name="taskTitle" required></div><div class="crm-field" data-for="task"><label>Due date</label><input class="crm-input" type="date" name="taskDue"></div><div class="crm-field full"><label>Note</label><textarea class="crm-textarea" name="note" placeholder="Context, next step, or why this matters…"></textarea></div><div class="crm-form-footer"><a class="crm-button ghost" href="../index.html">Cancel</a><button class="crm-button" type="submit">Save to CRM <span>→</span></button></div></form><footer class="footer-links"><a class="page-link" href="contacts.html">Contacts</a><a class="page-link" href="money-trail.html">Money trail</a><a class="page-link" href="search.html">Search</a></footer></main><script src="../crm.js"></script><script>(()=>{const form=document.getElementById('captureForm'),type=document.getElementById('captureType');function fields(){document.querySelectorAll('[data-for]').forEach(el=>{const show=el.dataset.for.split(' ').includes(type.value);el.style.display=show?'grid':'none';el.querySelectorAll('input,select,textarea').forEach(i=>i.required=show&&['name','taskTitle'].includes(i.name))})}type.addEventListener('change',fields);const params=new URLSearchParams(location.search);if(params.get('type'))type.value=params.get('type');fields();form.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(form),t=type.value,note=f.get('note');if(t==='contact'){MuseCRM.add('contacts',{name:f.get('name'),person:f.get('person'),email:f.get('email'),company:f.get('name'),stage:f.get('stage'),value:0,status:'active',tags:[],note})}if(t==='deal'){const c=MuseCRM.get().contacts.find(x=>x.name.toLowerCase()===String(f.get('name')).toLowerCase());MuseCRM.add('deals',{title:f.get('name'),contactId:c?.id||'',amount:Number(f.get('amount'))||0,stage:f.get('stage'),due:f.get('due'),status:'open',note})}if(t==='transaction')MuseCRM.add('transactions',{title:note||'New transaction',type:f.get('txType'),amount:Number(f.get('amount'))||0,date:MuseCRM.today,category:f.get('category'),note});if(t==='task')MuseCRM.add('tasks',{title:f.get('taskTitle'),due:f.get('taskDue'),priority:'normal',done:false,contactId:''});MuseCRM.toast('Saved to your CRM');setTimeout(()=>location.href=t==='contact'?'contacts.html':t==='transaction'?'money-trail.html':'../index.html',500)})})();</script><script src="../app.js"></script>
</body></html>
