<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070a11"><title>Search · Muse CRM</title><link rel="icon" href="../assets/muse-favicon.svg"><link rel="stylesheet" href="../pages.css"><link rel="stylesheet" href="../crm.css"></head><body>
<canvas id="signal-field" aria-hidden="true"></canvas><div class="grain" aria-hidden="true"></div><main class="page-shell"><header class="page-top"><a class="page-brand" href="../index.html"><img src="../assets/muse-mark.svg" alt="">MUSE<span style="color:#c8ff5a">.</span></a><a class="back-link" href="../index.html">← Signal Desk</a></header><section class="page-hero"><span class="eyebrow">FIND THE SIGNAL</span><h1>Search your workspace.</h1><p>Search every record you have captured. Results stay in your browser until you export them.</p></section><div class="crm-toolbar"><input class="crm-input crm-search" id="workspaceSearch" autofocus placeholder="Try “the contact”, “income”, “proposal”, or “follow up”…"><a class="crm-button" href="capture.html">+ Capture</a></div><div class="crm-table-wrap"><table class="crm-table"><thead><tr><th>TYPE</th><th>RECORD</th><th>DETAIL</th><th>ACTION</th></tr></thead><tbody id="searchRows"><tr><td colspan="4" class="empty-state">Start typing to search your CRM.</td></tr></tbody></table></div><footer class="footer-links"><a class="page-link" href="contacts.html">Contacts</a><a class="page-link" href="money-trail.html">Money trail</a><a class="page-link" href="capture.html">Capture</a></footer></main><script src="../crm.js"></script><script>(()=>{const input=document.getElementById('workspaceSearch'),rows=document.getElementById('searchRows');function render(){const q=input.value.trim().toLowerCase();if(!q){rows.innerHTML='<tr><td colspan="4" class="empty-state">Start typing to search your CRM.</td></tr>';return}const d=MuseCRM.get(),items=[...d.contacts.map(x=>({type:'Contact',title:x.name,detail:`${x.person||''} ${x.email||''} ${x.note||''}`,href:'contacts.html'})),...d.deals.map(x=>({type:'Deal',title:x.title,detail:`${x.stage} ${x.amount} ${x.note||''}`,href:'money-trail.html'})),...d.transactions.map(x=>({type:'Money',title:x.title,detail:`${x.type} ${x.category} ${x.amount} ${x.note||''}`,href:'money-trail.html'})),...d.tasks.map(x=>({type:'Task',title:x.title,detail:`${x.due||''} ${x.priority}`,href:'../index.html'}))].filter(x=>(x.title+' '+x.detail).toLowerCase().includes(q));rows.innerHTML=items.length?items.map(x=>`<tr><td><span class="crm-status active">${x.type}</span></td><td><strong>${MuseCRM.esc(x.title)}</strong></td><td><small>${MuseCRM.esc(x.detail)}</small></td><td><a class="crm-button ghost" href="${x.href}">Open</a></td></tr>`).join(''):'<tr><td colspan="4" class="empty-state">No records match that signal.</td></tr>'}input.addEventListener('input',render)})();</script><script src="../app.js"></script>
</body></html>
